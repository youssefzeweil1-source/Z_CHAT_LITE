<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Z CHAT PLUS">
    <title>ℤ𝔼𝕎𝔼𝕀𝕃 ℂℍ𝔸𝕋 ℙ𝕃𝕌𝕊 v3.0</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%235b8cff' width='192' height='192'/><text x='50%' y='50%' font-size='120' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='central'>Z</text></svg>">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --main-color: #5b8cff;
            --main-color-2: #ff7aa2;
            --accent-3: #25c5a8;
            --accent-4: #ffb454;
            --bg-dark: #0f1117;
            --panel-bg: #171b24;
            --glass-bg: rgba(23, 27, 36, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #eef1f7;
            --text-secondary: #9ca3b3;
            --card-border: #2b3342;
            --app-vh: 1vh;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        body {
            background: linear-gradient(135deg, #0f1117 0%, #1a1f2e 50%, #0f1117 100%);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
            overflow-x: hidden;
        }
        
        /* ==================== GLASSMORPHISM STYLES ==================== */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .glass-button {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        .glass-button:hover {
            background: rgba(91, 140, 255, 0.15);
            border-color: var(--main-color);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(91, 140, 255, 0.2);
        }
        
        .glass-button:active {
            transform: translateY(0);
        }
        
        /* ==================== MAIN LAYOUT ==================== */
        #app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        /* ==================== HEADER ==================== */
        .header {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .header-title {
            background: linear-gradient(90deg, var(--main-color), var(--main-color-2), var(--accent-3));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: clamp(1.2rem, 4vw, 1.6rem);
            font-weight: 800;
            letter-spacing: 1px;
        }
        
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 10px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .icon-btn:hover {
            background: rgba(91, 140, 255, 0.15);
            color: var(--main-color);
        }
        
        /* ==================== MAIN CONTENT ==================== */
        .content-wrapper {
            flex: 1;
            display: flex;
            gap: 12px;
            padding: 12px;
            overflow: hidden;
        }
        
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        
        .chat-box {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
            border-radius: 16px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            scroll-behavior: smooth;
        }
        
        .message {
            display: flex;
            gap: 8px;
            animation: slideIn 0.3s ease;
            max-width: 85%;
        }
        
        .message.own {
            align-self: flex-end;
            flex-direction: row-reverse;
            max-width: 85%;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message-bubble {
            padding: 10px 14px;
            border-radius: 14px;
            word-wrap: break-word;
            max-width: 100%;
            line-height: 1.4;
        }
        
        .message.own .message-bubble {
            background: linear-gradient(135deg, var(--main-color), var(--main-color-2));
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .message.other .message-bubble {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }
        
        /* ==================== INPUT AREA ==================== */
        .input-area {
            display: flex;
            gap: 8px;
            padding: 12px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid var(--glass-border);
            border-radius: 16px 16px 0 0;
            flex-wrap: wrap;
        }
        
        #messageInput {
            flex: 1;
            min-width: 150px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
            resize: none;
            max-height: 100px;
        }
        
        #messageInput:focus {
            background: rgba(91, 140, 255, 0.1);
            border-color: var(--main-color);
            box-shadow: 0 0 12px rgba(91, 140, 255, 0.2);
        }
        
        #sendBtn {
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--main-color), var(--main-color-2));
            border: none;
            color: white;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        
        #sendBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(91, 140, 255, 0.3);
        }
        
        #sendBtn:active {
            transform: translateY(0);
        }
        
        /* ==================== SIDEBAR ==================== */
        .sidebar {
            width: 280px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .sidebar-header {
            padding: 12px;
            border-bottom: 1px solid var(--glass-border);
            font-weight: 600;
            color: var(--main-color);
        }
        
        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        
        .friend-item {
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.02);
        }
        
        .friend-item:hover {
            background: rgba(91, 140, 255, 0.15);
        }
        
        .friend-name {
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .friend-status {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 4px;
        }
        
        .status-dot.online {
            background: #0f0;
            box-shadow: 0 0 4px #0f0;
        }
        
        .status-dot.offline {
            background: #ff3333;
        }
        
        /* ==================== NOTIFICATIONS ==================== */
        .notification-container {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .notification {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--text-primary);
            font-size: 0.9rem;
            max-width: 300px;
            animation: slideInNotif 0.3s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        
        @keyframes slideInNotif {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .notification.success {
            border-color: var(--accent-3);
        }
        
        .notification.error {
            border-color: #ff3333;
        }
        
        .notification.info {
            border-color: var(--main-color);
        }
        
        /* ==================== RESPONSIVE DESIGN ==================== */
        @media (max-width: 1024px) {
            .sidebar {
                width: 240px;
            }
            
            .message {
                max-width: 90%;
            }
        }
        
        @media (max-width: 768px) {
            .content-wrapper {
                flex-direction: column;
                padding: 8px;
            }
            
            .sidebar {
                width: 100%;
                height: 200px;
                border-radius: 12px;
            }
            
            .header {
                padding: 10px 12px;
            }
            
            .header-title {
                font-size: 1.2rem;
            }
            
            .message {
                max-width: 95%;
            }
            
            .message.own {
                max-width: 95%;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 0;
            }
            
            #app-container {
                border-radius: 0;
            }
            
            .header {
                padding: 8px;
                gap: 6px;
            }
            
            .header-title {
                font-size: 1rem;
                letter-spacing: 0.5px;
            }
            
            .content-wrapper {
                padding: 6px;
                gap: 6px;
            }
            
            .sidebar {
                height: 150px;
                border-radius: 8px;
            }
            
            .chat-box {
                border-radius: 12px;
                padding: 8px;
            }
            
            .input-area {
                padding: 8px;
                border-radius: 12px 12px 0 0;
            }
            
            #messageInput {
                font-size: 0.9rem;
                padding: 8px 12px;
            }
            
            #sendBtn {
                padding: 8px 16px;
                font-size: 0.9rem;
            }
            
            .message-bubble {
                padding: 8px 12px;
                font-size: 0.9rem;
            }
        }
        
        /* ==================== SCROLLBAR STYLING ==================== */
        .chat-box::-webkit-scrollbar,
        .sidebar-content::-webkit-scrollbar {
            width: 6px;
        }
        
        .chat-box::-webkit-scrollbar-track,
        .sidebar-content::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .chat-box::-webkit-scrollbar-thumb,
        .sidebar-content::-webkit-scrollbar-thumb {
            background: rgba(91, 140, 255, 0.3);
            border-radius: 3px;
        }
        
        .chat-box::-webkit-scrollbar-thumb:hover,
        .sidebar-content::-webkit-scrollbar-thumb:hover {
            background: rgba(91, 140, 255, 0.6);
        }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- HEADER -->
        <div class="header">
            <div class="header-title">ℤ𝔼𝕎𝔼𝕀𝕃 ℂℍ𝔸𝕋 v3.0</div>
            <div class="header-actions">
                <button class="icon-btn" id="notificationBtn" title="الإشعارات">🔔</button>
                <button class="icon-btn" id="settingsBtn" title="الإعدادات">⚙️</button>
                <button class="icon-btn" id="themeBtn" title="تبديل السمة">🌙</button>
            </div>
        </div>
        
        <!-- MAIN CONTENT -->
        <div class="content-wrapper">
            <!-- CHAT SECTION -->
            <div class="chat-section">
                <div class="chat-box" id="chatBox">
                    <div style="text-align: center; color: var(--text-secondary); padding: 20px;">
                        👋 مرحباً بك في الإصدار الجديد! ابدأ الدردشة الآن...
                    </div>
                </div>
                
                <!-- INPUT AREA -->
                <div class="input-area">
                    <textarea id="messageInput" placeholder="اكتب رسالتك هنا..." rows="1"></textarea>
                    <button id="sendBtn" class="glass-button">إرسال</button>
                </div>
            </div>
            
            <!-- SIDEBAR -->
            <div class="sidebar">
                <div class="sidebar-header">👥 الأصدقاء</div>
                <div class="sidebar-content" id="friendsList">
                    <div class="friend-item">
                        <div class="friend-name">أحمد محمد</div>
                        <div class="friend-status">
                            <span class="status-dot online"></span>
                            متصل الآن
                        </div>
                    </div>
                    <div class="friend-item">
                        <div class="friend-name">فاطمة علي</div>
                        <div class="friend-status">
                            <span class="status-dot online"></span>
                            متصل الآن
                        </div>
                    </div>
                    <div class="friend-item">
                        <div class="friend-name">محمود حسن</div>
                        <div class="friend-status">
                            <span class="status-dot offline"></span>
                            غير متصل
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- NOTIFICATION CONTAINER -->
    <div class="notification-container" id="notificationContainer"></div>
    
    <!-- PWA MANIFEST -->
    <script>
        // ==================== PWA SETUP ====================
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
        }
        
        // ==================== NOTIFICATIONS API ====================
        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        }
        
        function sendNotification(title, options = {}) {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(title, {
                    icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect fill="%235b8cff" width="192" height="192"/><text x="50%" y="50%" font-size="120" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="central">Z</text></svg>',
                    badge: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect fill="%235b8cff" width="192" height="192"/></svg>',
                    ...options
                });
            }
        }
        
        function showLocalNotification(message, type = 'info') {
            const container = document.getElementById('notificationContainer');
            const notif = document.createElement('div');
            notif.className = `notification ${type}`;
            notif.textContent = message;
            container.appendChild(notif);
            
            setTimeout(() => {
                notif.style.opacity = '0';
                notif.style.transform = 'translateX(-20px)';
                setTimeout(() => notif.remove(), 300);
            }, 3000);
        }
        
        // ==================== CHAT FUNCTIONALITY ====================
        const chatBox = document.getElementById('chatBox');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        
        function addMessage(text, isOwn = true) {
            const message = document.createElement('div');
            message.className = `message ${isOwn ? 'own' : 'other'}`;
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = text;
            
            message.appendChild(bubble);
            chatBox.appendChild(message);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        
        sendBtn.addEventListener('click', () => {
            const text = messageInput.value.trim();
            if (text) {
                addMessage(text, true);
                messageInput.value = '';
                messageInput.style.height = 'auto';
                
                // Simulate response
                setTimeout(() => {
                    addMessage('رسالة تلقائية: شكراً على رسالتك! 👋', false);
                    sendNotification('رسالة جديدة', {
                        body: 'لديك رسالة جديدة من الدردشة',
                        tag: 'chat-notification'
                    });
                }, 500);
            }
        });
        
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });
        
        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 100) + 'px';
        });
        
        // ==================== THEME TOGGLE ====================
        const themeBtn = document.getElementById('themeBtn');
        themeBtn.addEventListener('click', () => {
            document.documentElement.style.filter = 
                document.documentElement.style.filter === 'invert(1)' ? 'invert(0)' : 'invert(1)';
            themeBtn.textContent = document.documentElement.style.filter === 'invert(1)' ? '☀️' : '🌙';
        });
        
        // ==================== NOTIFICATION BUTTON ====================
        document.getElementById('notificationBtn').addEventListener('click', () => {
            requestNotificationPermission();
            showLocalNotification('✅ تم تفعيل الإشعارات!', 'success');
        });
        
        // ==================== INITIALIZATION ====================
        window.addEventListener('load', () => {
            showLocalNotification('🎉 مرحباً بك في الإصدار الجديد!', 'info');
            requestNotificationPermission();
        });
    </script>
</body>
</html>
