<head>

  <title>TukGo — Prototype</title>
  <style>
    :root{--ink:#17252b;--muted:#71807a;--green:#0b8f68;--green2:#e8f7f0;--line:#e2ebe6;--bg:#f7f9f7;--card:#fff;--orange:#b07116;--orangeBg:#fff4de;--red:#d76752;--shadow:0 16px 45px rgba(21,58,44,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.app{min-height:100vh}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw;position:sticky;top:0;z-index:5}.logo{font-weight:900;font-size:25px;letter-spacing:-1px}.logo span{color:var(--green)}.live{display:flex;gap:8px;align-items:center;color:#087252;background:var(--green2);font-size:12px;font-weight:800;padding:8px 12px;border-radius:20px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}.layout{max-width:1220px;margin:auto;padding:28px 20px 60px}.shell{display:grid;grid-template-columns:240px 1fr;gap:25px;direction:ltr}.sidebar,.main{direction:rtl}.sidebar{background:#18342b;color:#fff;border-radius:24px;padding:22px;height:max-content;position:sticky;top:95px}.side-brand{font-size:23px;font-weight:900;margin-bottom:28px}.side-brand span{color:#62d2ad}.nav{display:grid;gap:8px}.nav button{background:transparent;color:#d0e5dc;text-align:right;padding:12px;border-radius:12px}.nav button.active,.nav button:hover{background:rgba(255,255,255,.12);color:#fff}.sidebar-note{font-size:11px;line-height:1.8;color:#a8c8bb;border-top:1px solid rgba(255,255,255,.15);margin-top:28px;padding-top:18px}.hero{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px}.eyebrow{color:var(--green);font-size:12px;font-weight:900;margin-bottom:5px}.h1{font-size:32px;margin:0;font-weight:900}.sub{color:var(--muted);font-size:13px;line-height:1.8;margin:7px 0 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 3px 18px rgba(21,58,44,.025)}.stat-num{font-size:25px;font-weight:900;color:var(--green)}.stat-label{font-size:11px;color:var(--muted);margin-top:5px}.section{margin-top:24px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.section-title{font-size:19px;margin:0;font-weight:900}.section-tag{font-size:11px;background:var(--orangeBg);color:var(--orange);padding:6px 10px;border-radius:20px;font-weight:800}.map{height:330px;border-radius:20px;background:#dcece4;position:relative;overflow:hidden;border:1px solid #cde0d6;background-image:linear-gradient(#b1d1c2 1px,transparent 1px),linear-gradient(90deg,#b1d1c2 1px,transparent 1px);background-size:56px 56px}.road{position:absolute;height:10px;background:#fff;border-radius:10px;transform:rotate(24deg);opacity:.9}.road.a{width:520px;top:90px;right:-70px}.road.b{width:460px;top:225px;right:120px;transform:rotate(-28deg)}.road.c{width:370px;top:165px;right:225px;transform:rotate(90deg)}.pin{position:absolute;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;border:3px solid #fff;font-weight:900;box-shadow:0 5px 12px #457d67}.pin.a{background:var(--green);top:90px;right:180px}.pin.b{background:#f06b4f;bottom:85px;left:160px}.map-label{position:absolute;top:15px;right:17px;color:#557267;font-size:12px;font-weight:800}.route-form{background:#fff;border-radius:15px;padding:8px 12px;position:absolute;bottom:12px;left:12px;right:12px;box-shadow:0 8px 25px rgba(26,67,52,.12)}.field-row{display:flex;gap:10px;align-items:center;padding:8px 0}.field-row+.field-row{border-top:1px solid #edf2ef}.circle{width:9px;height:9px;border-radius:50%;flex:none}.field-row input{border:0;outline:0;width:100%;color:var(--ink);background:transparent;font-size:13px}.input,.select{border:1px solid var(--line);border-radius:11px;padding:11px 12px;width:100%;outline:none;background:#fbfdfc;color:var(--ink)}.input:focus{border-color:var(--green)}.btn{padding:12px 16px;border-radius:11px;font-size:12px;font-weight:900;transition:.16s}.btn:active{transform:scale(.97)}.btn.primary{background:var(--green);color:#fff}.btn.secondary{background:#eff7f3;color:#087252}.btn.outline{border:1px solid var(--line);background:#fff;color:#60736b}.btn.warn{background:var(--orangeBg);color:var(--orange)}.btn.danger{background:#fff0ed;color:var(--red)}.btn.full{width:100%}.actions{display:flex;gap:8px;align-items:center}.offer{display:flex;align-items:center;gap:12px}.offers{display:grid;gap:10px}.avatar{width:44px;height:44px;border-radius:14px;background:#ddf2e9;color:var(--green);display:grid;place-items:center;font-size:18px;font-weight:900;flex:none}.offer-main{flex:1}.offer-name{font-weight:900;font-size:13px}.meta{color:var(--muted);font-size:10px;margin-top:5px}.price{font-size:18px;font-weight:900}.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.plan{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;position:relative}.plan.pop{border:2px solid var(--green)}.plan-badge{position:absolute;top:-10px;right:13px;background:var(--green);color:#fff;font-size:10px;border-radius:20px;padding:5px 9px}.plan h3{margin:0;font-size:15px}.plan .amount{font-size:22px;font-weight:900;color:var(--green);margin:12px 0 6px}.plan small{color:var(--muted);font-size:10px}.plan button{margin-top:16px;width:100%}.notice{background:var(--orangeBg);border:1px solid #f2d79e;border-radius:14px;padding:12px;color:#855818;font-size:12px;line-height:1.8}.progress{height:8px;background:#edf2ef;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green);width:76%}.docs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.doc{border:1px dashed #b8d3c5;border-radius:13px;padding:13px;background:#fbfefc}.doc label{display:block;color:#38574b;font-weight:800;font-size:12px;margin-bottom:8px}.doc input{font-size:11px;width:100%}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.review{display:grid;gap:12px}.review-row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #edf2ef;padding-bottom:11px}.review-row:last-child{border:0;padding-bottom:0}.badge{font-size:10px;font-weight:900;padding:6px 9px;border-radius:20px;background:#e8f7f0;color:#087252}.badge.orange{background:var(--orangeBg);color:var(--orange)}.badge.red{background:#fff0ed;color:var(--red)}.locked{border:2px solid #f1c25f;background:#fffaf0;text-align:center;padding:22px;border-radius:18px}.stars{display:flex;gap:5px;justify-content:center;direction:ltr;margin:15px 0}.star{font-size:29px;color:#d4dfd9;background:transparent}.star.on{color:#f1ad31}.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:10px 0 16px}.tag{border:1px solid #dbe8e1;color:#5c756a;background:#fff;border-radius:20px;padding:8px 11px;font-size:11px}.tag.selected{background:var(--green2);border-color:#8ed0b5;color:#087252}.toast{position:fixed;bottom:22px;left:22px;background:#17362b;color:#fff;padding:13px 16px;border-radius:12px;font-size:12px;box-shadow:var(--shadow);z-index:10}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 10% 10%,#dff5eb 0,transparent 34%),var(--bg)}.login-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:25px;padding:28px;box-shadow:var(--shadow);text-align:center}.login-logo{width:68px;height:68px;background:var(--green);color:#fff;border-radius:22px;display:grid;place-items:center;margin:0 auto 14px;font-size:22px;font-weight:900;transform:rotate(-7deg)}.login-card h1{margin:0;font-size:30px}.login-card h1 span{color:var(--green)}.role-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0 14px}.role{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.role.active{border-color:var(--green);background:var(--green2)}.role strong{display:block}.role small{color:var(--muted);font-size:10px}.divider{display:flex;gap:10px;align-items:center;color:#9aaaA2;font-size:11px;margin:14px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.muted-note{font-size:10px;color:var(--muted);line-height:1.7;margin-top:12px}.modal{position:fixed;inset:0;background:rgba(10,30,23,.45);display:grid;place-items:center;padding:18px;z-index:8}.modal-card{background:#fff;border-radius:20px;padding:20px;width:min(440px,100%)}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{background:#f3f6f4;border-radius:50%;width:30px;height:30px}.footer-note{font-size:10px;color:#9aa9a1;text-align:center;margin-top:25px}
    @media(max-width:850px){.shell{grid-template-columns:1fr}.sidebar{position:static}.nav{grid-template-columns:repeat(4,1fr)}.sidebar-note{display:none}.grid,.plan-grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.h1{font-size:25px}.sidebar{padding:15px;border-radius:18px}.side-brand{margin-bottom:14px}.nav button{font-size:11px;padding:9px}.docs{grid-template-columns:1fr}}
  </style>
</head>
<script src="tukgo-config.js"></script>
  <body>
  <div id="app"></div>
  <div id="toast" class="toast hidden"></div>
  <div id="modal" class="modal hidden"></div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithPopup, GoogleAuthProvider, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import { getDatabase, ref, set, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const firebaseConfig = { apiKey:"AIzaSyBqWgXZHVd4BXJIJ6FyOlA5DUOEMqsLruY", authDomain:"tukgo-c906b.firebaseapp.com", databaseURL:"https://tukgo-c906b-default-rtdb.europe-west1.firebasedatabase.app", projectId:"tukgo-c906b", storageBucket:"tukgo-c906b.firebasestorage.app", messagingSenderId:"789724866023", appId:"1:789724866023:web:a58bc13a0353ab19ac0942", measurementId:"G-YN6TCMFXC5" };
    const firebaseApp = initializeApp(firebaseConfig); const auth = getAuth(firebaseApp); const db = getDatabase(firebaseApp);
    // ضع Browser Key مقيّدًا على دومين موقعك هنا لتفعيل Google Maps الحقيقي.
    const GOOGLE_MAPS_API_KEY = window.TUKGO_GOOGLE_MAPS_API_KEY || "";
    const CLOUDINARY_CLOUD_NAME = window.TUKGO_CLOUDINARY_CLOUD_NAME || "";
    const CLOUDINARY_UPLOAD_PRESET = window.TUKGO_CLOUDINARY_UPLOAD_PRESET || "";
    async function uploadReceiptToCloudinary(file, uid){if(!CLOUDINARY_CLOUD_NAME || !CLOUDINARY_UPLOAD_PRESET) throw new Error("Cloudinary upload settings missing");const body=new FormData();body.append("file",file);body.append("upload_preset",CLOUDINARY_UPLOAD_PRESET);body.append("folder",`tukgo/subscription-receipts/${uid}`);const response=await fetch(`https://api.cloudinary.com/v1_1/${encodeURIComponent(CLOUDINARY_CLOUD_NAME)}/image/upload`,{method:"POST",body});if(!response.ok) throw new Error("Cloudinary upload failed");return (await response.json()).secure_url;}
    let session = JSON.parse(localStorage.getItem('tukgo-session') || 'null');
    let phoneConfirmation = null;
    let currentView = 'overview'; let selectedRole = 'rider'; let selectedPlan = 'monthly'; let chosenStars = 0; const chosenTags = new Set();
    const offers = [{name:'محمد السيد',rating:'4.9',price:35,eta:'3 دقائق',meta:'0.8 كم · 128 رحلة'},{name:'أحمد رجب',rating:'4.8',price:40,eta:'5 دقائق',meta:'1.2 كم · 96 رحلة'},{name:'كريم حسن',rating:'4.7',price:30,eta:'6 دقائق',meta:'1.6 كم · 74 رحلة'}];
    const plans = [{id:'weekly',title:'أسبوعي',amount:'40 جنيه',sub:'أول اشتراك فقط',after:'بعده 50 جنيه'},{id:'monthly',title:'شهري',amount:'200 جنيه',sub:'تشغيل كامل لمدة شهر',after:'تجديد يدوي'},{id:'yearly',title:'سنوي ترويجي',amount:'2,000 جنيه',sub:'توفير ضخم لتشجيع السائقين',after:'تجديد يدوي'}];
    const $ = (q)=>document.querySelector(q); const esc = (x)=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2600)}
    async function writeProfile(name,role,provider='anonymous'){try{let cred=auth.currentUser;if(!cred) cred=(await signInAnonymously(auth)).user;await set(ref(db,'users/'+cred.uid),{uid:cred.uid,name,accountType:role,status:role==='driver'?'pending_documents':'active',provider,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});return cred}catch(e){toast('Firebase: فعّل Anonymous أو راجع قواعد قاعدة البيانات');throw e}}
    function loginScreen(){return `<div class="login-wrap"><div class="login-card"><div class="login-logo">TG</div><h1>Tuk<span>Go</span></h1><p class="sub">مشوارك أسرع وأسهل بالتوك توك</p><div class="role-choice"><button class="role ${selectedRole==='rider'?'active':''}" data-role="rider"><strong>راكب</strong><small>أطلب مشوار</small></button><button class="role ${selectedRole==='driver'?'active':''}" data-role="driver"><strong>سائق</strong><small>استقبل رحلات</small></button></div><input id="guestName" class="input" placeholder="اسمك بالكامل"/><button id="guestBtn" class="btn primary full" style="margin-top:10px">دخول كزائر</button><div class="divider">أو</div><button id="googleBtn" class="btn outline full">المتابعة باستخدام Google</button><button id="phoneBtn" class="btn secondary full" style="margin-top:8px">الدخول برقم الهاتف OTP</button><p class="muted-note">سيتم حفظ نوع الحساب مرة واحدة. بعد التسجيل ستظهر خدمات الحساب فقط.</p></div></div>`}
    function nav(){return `<aside class="sidebar"><div class="side-brand">Tuk<span>Go</span></div><div class="nav">${(session?.accountType==='driver'?[['overview','الرئيسية'],['bidding','الطلبات'],['subscriptions','الاشتراك'],['onboarding','ملفي']]:session?.accountType==='admin'?[['overview','الرئيسية'],['subscriptions','الباقات'],['onboarding','مراجعة السائقين'],['bidding','الرحلات']]:[['overview','اطلب رحلة'],['bidding','العروض'],['rating','تقييماتي']]).map(([id,label])=>`<button class="${currentView===id?'active':''}" data-view="${id}">${label}</button>`).join('')}</div><div class="sidebar-note">الدفع بين الراكب والسائق نقدًا. لا توجد عمولة على الرحلة.<br/><br/>Firebase: <b>tukgo-c906b</b></div></aside>`}
    function header(title,sub){return `<div class="hero"><div><div class="eyebrow">${session?.accountType==='driver'?'مساحة السائق':session?.accountType==='admin'?'لوحة الإدارة':'تطبيق العملاء'}</div><h1 class="h1">${title}</h1><p class="sub">${sub}</p></div><div class="live"><i class="dot"></i>${esc(session?.name||'زائر')} · متصل</div></div>`}
    function overview(){if(session.accountType==='driver')return driverOverview();if(session.accountType==='admin')return adminOverview();return `<section>${header('اطلب مشوارك','حدد البداية والنهاية، واقترح سعر كاش مناسبًا للسائقين القريبين.') }<div class="card"><div class="map" id="tukgoMap"><div class="map-label">أبو سلطان / فايد · خريطة الطلب</div><div class="road a"></div><div class="road b"></div><div class="road c"></div><div class="pin a">A</div><div class="pin b">B</div><div class="route-form"><div class="field-row"><span class="circle" style="background:#0b8f68"></span><input id="from" placeholder="نقطة البداية" value="ميدان أبو سلطان"/></div><div class="field-row"><span class="circle" style="background:#f06b4f"></span><input id="to" placeholder="نقطة النهاية" value="شارع فايد الرئيسي"/></div></div></div><div class="two" style="margin-top:14px"><div><label class="eyebrow">السعر المقترح كاش</label><input id="bidPrice" class="input" type="number" value="35"/></div><div><label class="eyebrow">ملاحظة للسايق</label><input class="input" placeholder="مثال: شنطة صغيرة"/></div></div><button class="btn primary full" style="margin-top:13px" id="publishRide">بث الطلب للسواقين القريبين</button></div></section><section class="section"><div class="section-head"><h2 class="section-title">طريقة العمل</h2><span class="section-tag">مزايدة كاش</span></div><div class="grid"><div class="card"><b>01 · اقترح</b><p class="sub">اكتب السعر المبدئي للرحلة.</p></div><div class="card"><b>02 · تفاوض</b><p class="sub">السائق يقبل أو يرسل عرضًا مضادًا.</p></div><div class="card"><b>03 · اختار</b><p class="sub">وافق على السعر ثم افتح التتبع.</p></div></div></section>`}
    function bidding(){return `<section>${header('عروض السائقين','راجع السعر الكاش والتقييم والوقت، ثم وافق أو ارفض أو اطلب تفاوضًا.') }<div class="notice">طلبك الحالي: <b>ميدان أبو سلطان ← شارع فايد الرئيسي</b> · السعر المقترح <b>35 جنيه كاش</b></div><div class="offers section">${offers.map((o,i)=>`<div class="card offer"><div class="avatar">${o.name[0]}</div><div class="offer-main"><div class="offer-name">${o.name} <span class="badge">★ ${o.rating}</span></div><div class="meta">${o.meta} · يصل خلال ${o.eta}</div></div><div class="price">${o.price} ج</div><div class="actions"><button class="btn outline" data-action="reject">رفض</button><button class="btn warn" data-action="negotiate">تفاوض</button><button class="btn primary" data-action="accept">موافقة</button></div></div>`).join('')}</div><div class="card section"><div class="section-head"><h2 class="section-title">قواعد المزايدة</h2><span class="badge">كاش فقط</span></div><p class="sub">إذا رفض الراكب العرض، يستطيع السائق تعديل السعر وإرسال عرض جديد. عند الموافقة يتم قفل الرحلة وفتح خريطة التتبع الحية.</p></div></section>`}
    function subscriptions(){return `<section>${header('باقات السائقين','الدفع خارج التطبيق عبر Vodafone Cash، والتفعيل يتم يدويًا من الإدارة.') }<div class="notice">التجديد الآمن: لا توجد بوابة دفع داخلية. يحوّل السائق خارج التطبيق، ثم تفتح الإدارة الحساب لمدة الباقة بضغطة زر.</div><div class="plan-grid section">${plans.map(p=>`<div class="plan ${p.id==='monthly'?'pop':''}">${p.id==='monthly'?'<span class="plan-badge">الأكثر اختيارًا</span>':''}<h3>${p.title}</h3><div class="amount">${p.amount}</div><small>${p.sub}<br/>${p.after}</small><button class="btn ${selectedPlan===p.id?'primary':'secondary'}" data-plan="${p.id}">${selectedPlan===p.id?'مختارة':'اختيار الباقة'}</button></div>`).join('')}</div><div class="two section"><div class="card"><h2 class="section-title">إثبات التحويل</h2><p class="sub">ارفع صورة الإيصال ورقم العملية، ثم أرسل الطلب للمراجعة.</p><input id="receiptFile" class="input" type="file" accept="image/*" style="margin:12px 0"/><input id="transactionId" class="input" placeholder="رقم العملية (اختياري)"/><button class="btn primary full" style="margin-top:12px" id="submitSub">إرسال للإدارة</button></div><div class="card"><h2 class="section-title">تنبيه التجديد</h2><p class="sub">سيتم إرسال تذكير للسائق قبل انتهاء الباقة بـ <b>48 ساعة</b>.</p><div class="progress"><i></i></div><p class="meta">متبقي 5 أيام · تذكير مجدول</p></div></div></section>`}
    function onboarding(){return `<section>${header('تسجيل السائق','لن يتم تفعيل الحساب أو استقبال الرحلات قبل مراجعة الإدارة.') }<div class="card"><div class="two"><div><label class="eyebrow">الاسم بالكامل</label><input class="input" placeholder="اسم السائق"/></div><div><label class="eyebrow">تاريخ الميلاد</label><input id="birthDate" class="input" type="date"/><small class="meta">يشترط ألا يقل العمر عن 18 سنة.</small></div></div><div class="docs section">${['بطاقة الرقم القومي','الفيش والتشبيه الجنائي','عقد ملكية أو مبايعة التوك توك','الصورة الشخصية'].map(x=>`<div class="doc"><label>${x}</label><input type="file" accept="image/*,.pdf"/></div>`).join('')}</div><label style="display:flex;gap:8px;align-items:center;margin-top:16px;font-size:12px"><input id="terms" type="checkbox"/> أوافق على شروط TukGo: الاحترام والقيادة الآمنة، وأفهم أن الحظر النهائي بسبب إساءة أو شكوى أمان خطيرة يجمّد الحساب ولا يحق معه استرداد الاشتراك المدفوع مقدمًا.</label><button class="btn primary full" style="margin-top:15px" id="submitOnboarding">إرسال للمراجعة</button></div></section>`}
    function rating(){return `<section>${header('إنهاء الرحلة والتقييم','بعد إنهاء السائق للرحلة، تبقى شاشة الراكب مقفولة حتى إرسال التقييم.') }<div class="locked"><span class="badge orange">تقييم إلزامي</span><h2 class="section-title" style="margin-top:12px">كيف كانت رحلتك مع السائق؟</h2><p class="sub">الرحلة: ميدان أبو سلطان ← شارع فايد الرئيسي · المبلغ المتفق عليه: 35 جنيه كاش</p><div class="stars">${[1,2,3,4,5].map(i=>`<button class="star ${chosenStars>=i?'on':''}" data-star="${i}">★</button>`).join('')}</div><div class="tags">${['سواق محترم','قيادة آمنة','وصل في المعاد','استغلال','قيادة خطرة'].map(t=>`<button class="tag ${chosenTags.has(t)?'selected':''}" data-tag="${t}">${t}</button>`).join('')}</div><button class="btn primary" id="sendRating">إرسال التقييم وفتح التطبيق</button></div><div class="card section"><h2 class="section-title">تأكيد التحصيل للسائق</h2><p class="sub">عند الضغط على إنهاء الرحلة، يؤكد السائق تحصيل المبلغ الكاش المتفق عليه.</p><button class="btn secondary" id="finishRide">إنهاء الرحلة وتأكيد التحصيل</button></div></section>`}
    function adminOverview(){return `<section>${header('لوحة الإدارة','إدارة الحسابات والاشتراكات والرحلات بأمان.') }<div class="grid"><div class="card"><div class="stat-num">12</div><div class="stat-label">سائق نشط</div></div><div class="card"><div class="stat-num">04</div><div class="stat-label">طلبات اشتراك معلقة</div></div><div class="card"><div class="stat-num">86</div><div class="stat-label">رحلة اليوم</div></div></div><div class="two section"><div class="card review"><div class="section-head"><h2 class="section-title">تفعيل يدوي</h2><span class="badge orange">مراجعة</span></div><div class="review-row"><span>محمود عبدالسلام · شهري</span><button class="btn primary" data-approve>تفعيل شهر</button></div><div class="review-row"><span>حسن علي · أسبوعي</span><button class="btn primary" data-approve>تفعيل أسبوع</button></div></div><div class="card"><h2 class="section-title">التذكيرات</h2><p class="sub">سيتم إشعار السائقين قبل انتهاء الباقة بـ48 ساعة.</p><span class="badge">الإشعارات مفعّلة</span></div></div></section>`}
    function driverOverview(){return `<section>${header('أهلاً يا سائق','استقبل عروض الرحلات بعد اعتماد أوراقك وتفعيل اشتراكك.') }<div class="grid"><div class="card"><div class="stat-num">معلّق</div><div class="stat-label">حالة الحساب</div></div><div class="card"><div class="stat-num">0</div><div class="stat-label">رحلات اليوم</div></div><div class="card"><div class="stat-num">—</div><div class="stat-label">الباقة الحالية</div></div></div><div class="card section"><h2 class="section-title">أكمل التسجيل</h2><p class="sub">ارفع المستندات، وافق على الشروط، ثم أرسل طلبك للإدارة. لن تستقبل طلبات قبل الاعتماد.</p><button class="btn primary" data-view="onboarding">ابدأ تسجيل السائق</button></div></section>`}
    function render(){if(!session){$('#app').innerHTML=loginScreen();bindLogin();return}$('#app').innerHTML=`<div class="topbar"><div class="logo">Tuk<span>Go</span></div><div class="live"><i class="dot"></i>${esc(session.name)} · ${session.accountType==='driver'?'سائق':session.accountType==='admin'?'إدارة':'راكب'}</div></div><main class="layout"><div class="shell">${nav()}<div class="main">${currentView==='overview'?overview():currentView==='bidding'?bidding():currentView==='subscriptions'?subscriptions():currentView==='onboarding'?onboarding():rating()}<div class="footer-note">Prototype تفاعلي · البيانات الحقيقية تحتاج قواعد Firebase وStorage وCloud Functions</div></div></div></main></div>`;bindApp()}
    function bindLogin(){$$('.role').forEach(b=>b.onclick=()=>{selectedRole=b.dataset.role;render()});$('#guestBtn').onclick=async()=>{const name=$('#guestName').value.trim();if(!name)return toast('اكتب اسمك أولًا');try{await writeProfile(name,selectedRole);session={name,accountType:selectedRole};localStorage.setItem('tukgo-session',JSON.stringify(session));render()}catch{}};$('#googleBtn').onclick=async()=>{try{const result=await signInWithPopup(auth,new GoogleAuthProvider());const name=result.user.displayName||result.user.email||'مستخدم Google';await writeProfile(name,selectedRole,'google');session={name,accountType:selectedRole};localStorage.setItem('tukgo-session',JSON.stringify(session));render()}catch(e){toast('فعّل Google Sign-in من Firebase ثم جرّب') }};$('#phoneBtn').onclick=()=>openPhoneModal()}
    function $$(q){return [...document.querySelectorAll(q)]}
    function bindApp(){$$('.nav button,[data-view]').forEach(b=>b.onclick=()=>{currentView=b.dataset.view;render()});$$('[data-action]').forEach(b=>b.onclick=()=>toast(b.dataset.action==='accept'?'تم قفل الرحلة وفتح التتبع الحي':b.dataset.action==='negotiate'?'أرسلنا عرض تفاوض للسائق':'تم رفض العرض، ويمكن للسائق إرسال عرض جديد'));$$('[data-plan]').forEach(b=>b.onclick=()=>{selectedPlan=b.dataset.plan;render()});$('#publishRide')?.addEventListener('click',async()=>{try{const ride=push(ref(db,'rides'));await set(ride,{riderId:auth.currentUser?.uid||'guest',from:$('#from').value,to:$('#to').value,suggestedPrice:Number($('#bidPrice').value),payment:'cash',area:'Abu Sultan/Fayed',status:'open',createdAt:serverTimestamp()});toast('تم بث الطلب للسائقين القريبين')}catch{toast('تعذر حفظ الرحلة؛ راجع قواعد Firebase')}});$('#submitSub')?.addEventListener('click', async()=>{const file=$('#receiptFile')?.files?.[0];if(!file)return toast('اختار صورة إيصال التحويل أولًا');if(!auth.currentUser)return toast('سجّل الدخول قبل إرسال الاشتراك');const uid=auth.currentUser.uid;const plan=plans.find(p=>p.id===selectedPlan);const button=$('#submitSub');button.disabled=true;button.textContent='جاري رفع الإيصال...';try{const receiptUrl=await uploadReceiptToCloudinary(file,uid);await set(ref(db,`subscriptions/${uid}`),{uid,name:session.name,plan:selectedPlan,amount:plan?.amount||'',transactionId:$('#transactionId')?.value.trim()||'',receiptUrl,status:'pending',submittedAt:serverTimestamp(),updatedAt:serverTimestamp()});button.textContent='تم الإرسال للمراجعة';toast('تم رفع الإيصال وإرساله للإدارة')}catch(e){console.error(e);button.disabled=false;button.textContent='إرسال للإدارة';toast('تعذر الرفع. تأكد من Cloudinary Cloud Name وUnsigned Upload Preset')}});$('#submitOnboarding')?.addEventListener('click',()=>{const dob=$('#birthDate').value;if(!dob||!$('#terms').checked)return toast('أكمل تاريخ الميلاد والموافقة على الشروط');const age=(Date.now()-new Date(dob).getTime())/31557600000;if(age<18)return toast('لا يمكن التسجيل: يجب أن يكون العمر 18 سنة أو أكثر');toast('تم إرسال أوراقك للإدارة')});$$('[data-star]').forEach(b=>b.onclick=()=>{chosenStars=Number(b.dataset.star);render()});$$('[data-tag]').forEach(b=>b.onclick=()=>{chosenTags.has(b.dataset.tag)?chosenTags.delete(b.dataset.tag):chosenTags.add(b.dataset.tag);render()});$('#sendRating')?.addEventListener('click',()=>{if(!chosenStars)return toast('اختار عدد النجوم أولًا');toast('تم تحديث تقييم السائق وفتح التطبيق');currentView='overview';render()});$('#finishRide')?.addEventListener('click',()=>{toast('تم تأكيد تحصيل الكاش وفتح شاشة التقييم');currentView='rating';render()});$$('[data-approve]').forEach(b=>b.onclick=()=>{b.textContent='تم التفعيل';b.disabled=true;b.className='btn secondary';toast('تم تفعيل الحساب يدويًا')})}
    async function finishAuthUser(user, provider, name) {
      const finalName = name || user.displayName || user.email || 'مستخدم TukGo';
      await writeProfile(finalName, selectedRole, provider);
      session = { name: finalName, accountType: selectedRole };
      localStorage.setItem('tukgo-session', JSON.stringify(session));
      $('#modal').classList.add('hidden');
      function loadGoogleMaps(){if(!GOOGLE_MAPS_API_KEY){toast('الخريطة التجريبية تعمل. أضف Google Maps Browser Key لتفعيل الخريطة الحقيقية',4500);return}window.initTukGoMap=()=>{const mapEl=document.getElementById('tukgoMap');if(!mapEl||!window.google)return;const map=new google.maps.Map(mapEl,{center:{lat:30.306, lng:32.293},zoom:13,disableDefaultUI:true});new google.maps.Marker({map,position:{lat:30.306,lng:32.293},title:'أبو سلطان'});new google.maps.Marker({map,position:{lat:30.310,lng:32.304},title:'فايد'});};const script=document.createElement('script');script.async=true;script.defer=true;script.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(GOOGLE_MAPS_API_KEY)}&libraries=places&callback=initTukGoMap`;document.head.appendChild(script)}
    render();
    setTimeout(loadGoogleMaps,250);
    }
    function openPhoneModal(){
      $('#modal').classList.remove('hidden');
      $('#modal').innerHTML=`<div class="modal-card"><div class="modal-head"><h2 class="section-title">تسجيل برقم الهاتف</h2><button class="close" id="closeModal">×</button></div><p class="sub">سيتم إرسال رمز OTP إلى رقمك قبل أول طلب رحلة.</p><input id="phoneName" class="input" placeholder="اسمك بالكامل"/><input id="phone" class="input" style="margin-top:8px" placeholder="+20 10 0000 0000"/><div id="recaptcha-container" style="margin-top:10px"></div><button id="sendOtp" class="btn primary full" style="margin-top:12px">إرسال رمز التحقق</button><div id="otpArea" class="hidden"><input id="otp" class="input" style="margin-top:10px" placeholder="اكتب رمز التحقق" inputmode="numeric"/><button id="confirmOtp" class="btn secondary full" style="margin-top:8px">تأكيد الرمز وإنشاء الحساب</button></div><p class="muted-note">تأكد من كتابة الرقم بصيغة دولية مثل +2010xxxxxxxx.</p></div>`;
      $('#closeModal').onclick=()=>$('#modal').classList.add('hidden');
      let verifier;
      $('#sendOtp').onclick=async()=>{
        const phone=$('#phone').value.trim();
        if(!$('#phoneName').value.trim() || !phone) return toast('اكتب الاسم ورقم الهاتف أولًا');
        try{
          verifier = new RecaptchaVerifier(auth,'recaptcha-container',{size:'normal'});
          phoneConfirmation = await signInWithPhoneNumber(auth,phone,verifier);
          $('#otpArea').classList.remove('hidden');
          $('#sendOtp').classList.add('hidden');
          toast('تم إرسال رمز التحقق');
        }catch(e){ toast('تعذر إرسال OTP؛ راجع الرقم أو إعدادات النطاق في Firebase'); try{await verifier?.clear()}catch{} }
      };
      $('#confirmOtp').onclick=async()=>{
        const code=$('#otp').value.trim();
        if(!phoneConfirmation || !code) return toast('اكتب رمز التحقق');
        try{ const result=await phoneConfirmation.confirm(code); await finishAuthUser(result.user,'phone',$('#phoneName').value.trim()); }catch{ toast('رمز التحقق غير صحيح أو انتهت صلاحيته'); }
      };
    }
    render();
  </script>
</body>
